[project]
name = "goldsignal"
version = "0.1.0"
description = "Gold-Signalsystem XAU_USD (OANDA): Signale, Thesen, Journal, ehrlicher Strategievergleich – kein automatisches Handeln"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "pandas>=2.1", "numpy>=1.26", "tzdata>=2024.1"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
goldsignal = "goldsignal.cli:main"

[tool.setuptools]
packages = ["goldsignal", "goldsignal.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
